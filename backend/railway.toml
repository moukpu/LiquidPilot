[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# No startCommand here: Railway runs startCommand via exec (not a shell),
# so $PORT does not expand and uvicorn crashes with
# "Invalid value for '--port': '$PORT' is not a valid integer".
# Instead we rely on the Dockerfile CMD, which uses `sh -c` and expands ${PORT}.
[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
