[project]
name = "liquidpilot-backend"
version = "0.1.0"
description = "LiquidPilot predictive liquidity cockpit backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "python-dateutil>=2.9",
    "holidays>=0.58",
    "numpy>=2.1",
    "pandas>=2.2",
    "networkx>=3.4",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "matplotlib>=3.9",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
